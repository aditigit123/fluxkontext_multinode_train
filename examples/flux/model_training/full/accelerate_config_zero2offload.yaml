compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  # Batch size configuration - DeepSpeed will use values from training script
  # train_micro_batch_size_per_gpu: controlled by --batch_size in script
  # train_batch_size: auto-calculated
  # gradient_accumulation_steps: controlled by --gradient_accumulation_steps in script
  # gradient_clipping: auto-detected from optimizer
  # Memory optimization - offload to CPU
  offload_optimizer_device: 'cpu'
  offload_param_device: 'cpu'
  zero3_init_flag: false
  zero_stage: 2
distributed_type: DEEPSPEED
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
